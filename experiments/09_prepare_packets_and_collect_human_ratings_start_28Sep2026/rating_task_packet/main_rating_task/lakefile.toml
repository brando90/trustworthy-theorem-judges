# Lean project for the VeriBench human-rating packet (Brando, 11-18-2026): opening this folder in an editor with the
# Lean 4 extension gives hover and go-to-definition for every name, so a rater can check which definition a name
# (e.g. `List`) points to. Same Lean and Mathlib versions as VeriBench (v4.22.0); see NEXT_PHASE2.md for setup.
name = "veribench_rating_packet"
defaultTargets = ["veribench"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.22.0"

# Two VeriBench modules that task_17_heapsort_algorithm/gold_lean/reference.lean imports, copied verbatim
# (see veribench/SOURCE.md). The task files themselves are checked with `lake env lean <file>`.
[[lean_lib]]
name = "veribench"
globs = ["veribench.+"]
